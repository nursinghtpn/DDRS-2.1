<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Sistem i-CG Nursing</title>

<!-- ===== PWA: Manifest ===== -->
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#7C6FB0">
<meta name="background-color" content="#EDEAF6">

<!-- ===== Favicon (pelayar desktop) ===== -->
<link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png?v=2">
<link rel="icon" type="image/png" sizes="512x512" href="./icons/icon-512.png?v=2">

<!-- ===== iOS: Add to Home Screen ===== -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="i-CG Nursing">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png?v=2">

<!-- ===== Android/Chrome ===== -->
<meta name="mobile-web-app-capable" content="yes">

<style>
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    overflow: hidden; background: #EDEAF6;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  }
  #app-frame {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    border: none; display: block;
    /* Sokong 'notch' iPhone supaya kandungan tak tertutup */
    padding-top: env(safe-area-inset-top);
  }
  /* ===== Skrin loading (dipapar sementara iframe sedang muat) ===== */
  #loading-screen {
    position: fixed; inset: 0; z-index: 10;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: linear-gradient(160deg, #5C5188, #7C6FB0 55%, #A79BD1);
    color: #fff; gap: 16px;
    transition: opacity .35s ease;
  }
  #loading-screen.hide { opacity: 0; pointer-events: none; }
  #loading-screen img {
    width: 88px; height: 88px; border-radius: 22px;
    box-shadow: 0 8px 28px rgba(0,0,0,.35);
  }
  #loading-screen .spinner {
    width: 28px; height: 28px; border-radius: 50%;
    border: 3px solid rgba(255,255,255,.25); border-top-color: #fff;
    animation: spin .8s linear infinite;
  }
  #loading-screen .txt { font-size: 14px; opacity: .85; letter-spacing: .3px; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ===== Skrin ralat (jika tiada sambungan internet) ===== */
  #offline-screen {
    position: fixed; inset: 0; z-index: 20; display: none;
    flex-direction: column; align-items: center; justify-content: center;
    background: #EDEAF6; color: #3D3856; gap: 14px; text-align: center; padding: 24px;
  }
  #offline-screen.show { display: flex; }
  #offline-screen button {
    margin-top: 10px; padding: 10px 22px; border-radius: 10px; border: none;
    background: #7C6FB0; color: #fff; font-weight: 600; font-size: 14px; cursor: pointer;
  }
</style>
</head>
<body>

  <!-- Skrin loading -->
  <div id="loading-screen">
    <img src="./icons/icon-192.png?v=2" alt="i-CG Nursing">
    <div class="spinner"></div>
    <div class="txt">Memuatkan Sistem i-CG Nursing...</div>
  </div>

  <!-- Skrin luar talian -->
  <div id="offline-screen">
    <img src="./icons/icon-192.png?v=2" width="64" height="64" style="border-radius:16px" alt="">
    <p style="font-size:16px;font-weight:600;margin:0;">Tiada sambungan internet</p>
    <p style="font-size:13px;opacity:.75;margin:0;max-width:280px;">Sila semak internet anda dan cuba lagi.</p>
    <button onclick="location.reload()">Cuba Semula</button>
  </div>

  <!-- Kandungan sebenar: Web App Apps Script -->
  <iframe id="app-frame"
          src="https://script.google.com/macros/s/AKfycbwuSntwWj5SK8EfFA6DfY17OcIIfrdUOuZ5D8P6yGVyNhQeh1mgWxdrb4HI_9JB1jSC/exec?kod=icg-vercel-2026"
          title="Sistem i-CG Nursing"
          allow="clipboard-write"></iframe>

<script>
  var frame = document.getElementById('app-frame');
  var loading = document.getElementById('loading-screen');
  var offline = document.getElementById('offline-screen');

  function hideLoading() {
    loading.classList.add('hide');
    setTimeout(function () { loading.style.display = 'none'; }, 400);
  }

  frame.addEventListener('load', hideLoading);
  // Fallback: buang skrin loading selepas 6 saat walaupun 'load' tak sempat tercetus
  setTimeout(hideLoading, 6000);

  window.addEventListener('offline', function () { offline.classList.add('show'); });
  window.addEventListener('online', function () { offline.classList.remove('show'); location.reload(); });
  if (!navigator.onLine) offline.classList.add('show');

  // Daftar Service Worker (diperlukan sesetengah pelayar Android untuk 'Install App')
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('./sw.js').catch(function () {});
    });
  }
</script>
</body>
</html>
